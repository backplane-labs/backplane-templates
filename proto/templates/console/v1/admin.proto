syntax = "proto3";

package templates.console.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/backplane-labs/backplane-templates/proto/templates/console/v1;templatesconsolev1";

// AdminService is templates' internal API: the console module's editor,
// relayed by backplane behind the operator's session. Products never
// call it; they render through the templates.Render activity.
service AdminService {
  // The installation's languages, for the editor.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Every template with its active version's parts and languages.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  // One template: its versions and the content of one of them (the
  // active one unless a version is asked for).
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  // Stores a new version with every language (creating the template on
  // first save). A source that does not compile refuses the save; the
  // sample not rendering is a problem reported, the version still saved.
  // The first version is activated; later ones when asked.
  rpc SaveTemplate(SaveTemplateRequest) returns (SaveTemplateResponse);
  // Makes a version the one Render uses (a rollback is activating an
  // older one).
  rpc ActivateVersion(ActivateVersionRequest) returns (ActivateVersionResponse);
  // Removes a template with every version.
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  // Renders one language of a draft with data on the server, with the
  // installation's active shared pieces; nothing is stored.
  rpc Preview(PreviewRequest) returns (PreviewResponse);
}

// Part is one output of a template, shared by its languages.
message Part {
  // [a-z][a-z0-9_]*: subject, text, html, title, body...
  string name = 1;
  // text or html (contextual escaping).
  string kind = 2;
}

// Translation is one language of a template: a source per part.
message Translation {
  // BCP 47: en, ru, pt-BR.
  string language = 1;
  // Part name to Go template source.
  map<string, string> sources = 2;
}

// Problem is what a part of a language is wrong about.
message Problem {
  string language = 1;
  string part = 2;
  string message = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  // Languages the editor offers, in order.
  repeated string languages = 1;
  // The language renders fall back to last.
  string default_language = 2;
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated TemplateSummary templates = 1;
}

message TemplateSummary {
  string name = 1;
  string description = 2;
  // 0: no version activated yet.
  int64 active_version = 3;
  int64 versions = 4;
  repeated string parts = 5;
  repeated string languages = 6;
  string default_language = 7;
  // Languages of the active version with an empty part.
  repeated string incomplete = 8;
  google.protobuf.Timestamp updated_at = 9;
  // The template's directory under the service's files source; empty: the
  // console's. A managed template is read-only here: saves, activations
  // and deletes fail with FAILED_PRECONDITION.
  string managed_by = 10;
}

message GetTemplateRequest {
  string name = 1;
  // The version to return the content of; 0: the active one.
  int64 version = 2;
}

message GetTemplateResponse {
  string name = 1;
  string description = 2;
  int64 active_version = 3;
  repeated VersionSummary versions = 4;
  // The requested version's content.
  Version content = 5;
  // As TemplateSummary.managed_by.
  string managed_by = 6;
}

message VersionSummary {
  int64 version = 1;
  string author = 2;
  string comment = 3;
  google.protobuf.Timestamp created_at = 4;
  repeated string languages = 5;
}

message Version {
  int64 version = 1;
  repeated Part parts = 2;
  repeated Translation translations = 3;
  string default_language = 4;
  // The sample data (JSON object) the editor previews with.
  string sample = 5;
  string author = 6;
  string comment = 7;
  google.protobuf.Timestamp created_at = 8;
}

message SaveTemplateRequest {
  string name = 1;
  string description = 2;
  repeated Part parts = 3;
  // At least one; every one gives a source for every part (empty allowed).
  repeated Translation translations = 4;
  // One of the translations.
  string default_language = 5;
  // JSON object.
  string sample = 6;
  string comment = 7;
  // Activate the new version at once.
  bool activate = 8;
}

message SaveTemplateResponse {
  int64 version = 1;
  bool activated = 2;
  // The sample not rendering, by language and part.
  repeated Problem problems = 3;
}

message ActivateVersionRequest {
  string name = 1;
  int64 version = 2;
}

message ActivateVersionResponse {}

message DeleteTemplateRequest {
  string name = 1;
}

message DeleteTemplateResponse {
  bool deleted = 1;
}

message PreviewRequest {
  repeated Part parts = 1;
  // The language to render: its sources and its rules (plural, numbers,
  // dates).
  Translation translation = 2;
  // JSON object.
  string data = 3;
}

message PreviewResponse {
  // Rendered parts by name; a part with a problem is absent.
  map<string, string> parts = 1;
  repeated Problem problems = 2;
}
